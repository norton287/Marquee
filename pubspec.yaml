name: marquee
description: A fast, native-feeling client for Plex and Jellyfin on phone, tablet, desktop and TV.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  dio: ^5.11.1
  cached_network_image: ^4.0.7
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  device_info_plus: ^13.3.0
  # Playback: libmpv under the hood, so nearly every container/codec direct plays.
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  # Picture in picture (Android) and mini-player window (desktop).
  floating: ^6.0.0
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
